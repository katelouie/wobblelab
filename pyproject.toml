[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wobblelab"
dynamic = ["version"]
description = "Measuring wobble: how much a model's answer moves under things that shouldn't move it."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Kate Louie", email = "katehlouie@gmail.com" }]
license = "MIT"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
bench = [
    "datasets>=3.0",  # loading standard MC benchmarks (MMLU, TruthfulQA)
]

# Single source of truth for the version: src/wobblelab/__init__.py __version__.
# Bump it there; the build, the wheel metadata, and PyPI all read from it.
[tool.hatch.version]
path = "src/wobblelab/__init__.py"
